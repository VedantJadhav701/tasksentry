[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tasksentry"
version = "0.1.0"
description = "TaskSentry: a budget-native agent harness and control plane for task-level cost, latency, reliability, and safety control."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TaskSentry contributors", email = "maintainers@tasksentry.org" }]
keywords = [
    "ai-agents",
    "llm",
    "budget",
    "reliability",
    "harness",
    "loop-detection",
    "verification",
    "agent-runtime",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
ollama = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]
openai = [
    "httpx>=0.25",
]
benchmark = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=4.0",
]

[project.scripts]
tasksentry = "tasksentry.cli:main"

[project.urls]
Homepage = "https://github.com/VedantJadhav701/tasksentry"
Repository = "https://github.com/VedantJadhav701/tasksentry.git"
Issues = "https://github.com/VedantJadhav701/tasksentry/issues"
Changelog = "https://github.com/VedantJadhav701/tasksentry/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tasksentry = ["py.typed", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
