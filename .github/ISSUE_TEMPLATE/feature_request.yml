name: Feature Request
description: Suggest an idea or enhancement for TaskSentry
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature or design enhancement for TaskSentry!
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a specific problem or missing capability?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Design
      description: Describe your proposed solution or API change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or code sketches here.
